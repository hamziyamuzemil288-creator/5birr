# Manual Supabase deploy — runs ONLY when dispatched, never on push.
# All live-project credentials come from GitHub secrets; none are echoed.
# Secrets required (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — supabase CLI auth (Management API)
#   SUPABASE_DB_PASSWORD   — used by `supabase db push`
#   INDEXER_KEY            — set as a Supabase function secret (never printed)
# Project ref is not a secret — it is public in every Supabase URL.

name: Deploy Supabase

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list pending migrations only, no changes applied)'
        type: boolean
        required: false
        default: true
      baseline_history:
        description: 'Mark pre-20260919 migrations as applied in history (never executes them)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: xnwieehlrhrffoikpglj
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  INDEXER_KEY: ${{ secrets.INDEXER_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Fail loudly on missing/empty secrets. GitHub maps a missing secret to
      # an EMPTY string, so [ -z ] is the reliable check — not shell unset.
      - name: Verify required secrets are present
        run: |
          set -eu
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD INDEXER_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v is missing or empty. Add it in Settings → Secrets and variables → Actions."
              missing=1
            fi
          done
          exit $missing

      # WHY STAGING IS ALWAYS RUN: the CLI identifies migrations by the
      # numeric prefix ONLY. `supabase_migrations.schema_migrations` has
      # `version text PRIMARY KEY` (verified in cli v2.117.0 source,
      # pkg/migration/history.go), and db push matches local files against
      # remote history by version (pkg/migration/apply.go,
      # FindPendingMigrations). This repo has two files sharing each of the
      # versions 0020/0021/0022/0024, so only one of each pair can ever be
      # recorded; the sibling stays "unapplied but older than the newest
      # remote migration" and fails the push with "Found local migration
      # files to be inserted before the last migration on remote database"
      # (run #4). We never rename or edit applied migrations, so instead the
      # workflow stages a copy of the migrations dir with ONE file per
      # version (alphabetically first, deterministic) and runs all CLI
      # commands against that copy. The duplicates' effects already exist in
      # the live DB (pasted via SQL editor); hiding them from the CLI is a
      # no-op there. For a FRESH/empty database this staging must be removed
      # so every file applies.
      - name: Stage migrations (one file per version)
        run: |
          set -eu
          stage="$(mktemp -d)"
          seen="$(mktemp)"
          count=0
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            v="${base%%_*}"
            case "$v" in
              ''|*[!0-9]*)
                echo "skip (CLI-ignored, non-numeric prefix): $base"
                continue ;;
            esac
            if grep -qx "$v" "$seen"; then
              echo "skip (duplicate version $v, sibling already staged): $base"
              continue
            fi
            echo "$v" >> "$seen"
            cp "$f" "$stage/"
            count=$((count+1))
          done
          rm -f "$seen"
          rm -rf supabase/migrations
          mv "$stage" supabase/migrations
          echo "Staged $count migration files (one per version, no duplicates)"

      # The live DB was built by pasting SQL in the Supabase editor, so the
      # CLI migration-history table has no record of 0001-0033 and a plain
      # `db push` would replay them from scratch (run #2: "type \"app_role\"
      # already exists" in 0001). `migration repair --status applied` writes
      # ONLY the history table (UPSERT ... ON CONFLICT (version)) — it never
      # executes the files — so it is safe to re-run. Versions 0001..0033
      # are marked applied from the STAGED dir (one file per version, so the
      # repair glob `version_*.sql` matches exactly one file each).
      # 20260919* files are NEVER marked applied by this step. The following
      # dry run is the gate: it must list exactly the three 20260919* files
      # and nothing older.
      - name: Baseline migration history (repair, no execution)
        if: ${{ inputs.baseline_history }}
        run: |
          set -eu
          versions=""
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            v="${base%%_*}"
            case "$v" in
              ''|*[!0-9]*)
                echo "::warning::CLI ignores migration file with non-numeric prefix: $base"
                continue ;;
            esac
            if [ $((10#$v)) -lt 20260919000000 ]; then
              versions="$versions $v"
            else
              echo "kept pending: $base"
            fi
          done
          for v in $(printf '%s\n' $versions | sort -u); do
            echo "Marking $v applied (no execution)"
            supabase migration repair --status applied "$v"
          done

      - name: Dry run (db push --dry-run)
        if: ${{ inputs.dry_run }}
        run: supabase db push --dry-run

      - name: Apply migrations (db push)
        if: ${{ !inputs.dry_run }}
        # --include-all: 0034 is newer than the CLI-recorded remote history
        # baseline but predates the newest remote migration; without the flag
        # db push refuses with "Found local migration files to be inserted
        # before the last migration on remote database".
        run: supabase db push --include-all

      - name: Deploy function repo-chat
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy repo-chat

      - name: Deploy function index-chunks (no JWT verification)
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy index-chunks --no-verify-jwt

      # Provider approval — wired to the admin Provider Management screen
      # (Approve / Correction / Reject buttons).
      - name: Deploy function provider-approval
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy provider-approval

      # Wallet functions. admin-wallet-recharge is wired to the admin UI
      # (payment verification approve/reject); the other two are deployed
      # ahead of need so the subscription scheduler only has to be enabled.
      - name: Deploy function admin-wallet-recharge
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy admin-wallet-recharge

      - name: Deploy function wallet-deduct-fee
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy wallet-deduct-fee

      - name: Deploy function subscription-process
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy subscription-process

      # Order + ride flow functions. order-create is the server-authoritative
      # checkout endpoint (validates fractional unit-priced quantities); the
      # transition/claim functions drive the ride state machine. These were
      # missing from this workflow since it was written, so merged changes to
      # them never reached the live project without a manual deploy.
      - name: Deploy function order-create
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy order-create

      - name: Deploy function order-transition
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy order-transition

      - name: Deploy function ride-claim
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy ride-claim

      - name: Deploy function ride-transition
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy ride-transition

      # Document QR verification agent (Task 4) — signup ID auto-approval.
      - name: Deploy function document-verify
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy document-verify

      # Email OTP delivery for signup (Task 7). Stub mode until an email
      # provider is wired (see the function header for the TODO).
      - name: Deploy function send-otp
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy send-otp

      - name: Deploy function staff-create-gateway
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-create-gateway

      # Permanent staff removal. Deployed here because the client cannot
      # delete an auth.users row without the service role key.
      - name: Deploy function staff-delete-gateway
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-delete-gateway

      - name: Deploy function staff-change-password
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-change-password

      - name: Deploy function staff-login (no JWT verification)
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy staff-login --no-verify-jwt

      # Task 13 item 2: server-side login gate — CAPTCHA enforcement +
      # per-account failure lockout before the password credential check.
      # Called by the Flutter login screen like send-otp (anon/user JWT).
      - name: Deploy function login-gate
        if: ${{ !inputs.dry_run }}
        run: supabase functions deploy login-gate

      - name: Set Supabase function secrets
        if: ${{ !inputs.dry_run }}
        run: |
          set -eu
          supabase secrets set INDEXER_KEY="$INDEXER_KEY"
          supabase secrets set LLM_PROVIDER=none

      # Fail loudly: every step fails the job on non-zero exit (`set -e` is
      # default in GH Actions run steps). The "Verify required secrets" step
      # aborts the run before anything touches the live project when any
      # secret is missing or empty, and the `set -eu` on the secrets step is
      # a second guard against an emptied INDEXER_KEY.
