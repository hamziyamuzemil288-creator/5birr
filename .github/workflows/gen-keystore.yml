name: Generate signing keystore

# One-shot helper: generates a NEW release keystore inside GitHub Actions
# from the owner's secrets and uploads it (base64) as a 1-day artifact so
# KEYSTORE_BASE64 can be set for the signing workflows. No password, key or
# fingerprint is ever printed. Delete this workflow after the secret is set.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/gen-keystore.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Fail loudly if required secrets are missing or mismatched
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          missing=0
          for v in KEYSTORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret $v is empty or missing"
              missing=1
            fi
          done
          [ "$missing" = "1" ] && exit 1
          if [ "$KEYSTORE_PASSWORD" != "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD and KEY_PASSWORD must match for PKCS12"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p out
          keytool -genkeypair \
            -storetype PKCS12 \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=5birr" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -keystore out/release-keystore.p12

      - name: Verify alias (output discarded — nothing secret reaches the log)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: keytool -list -keystore out/release-keystore.p12 -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Encode artifact (file only, never echoed)
        run: |
          base64 -w 0 out/release-keystore.p12 > out/release-keystore.b64.txt
          wc -c out/release-keystore.b64.txt

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: signing-keystore
          path: out/
          retention-days: 1
          if-no-files-found: error
