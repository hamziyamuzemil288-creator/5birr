# 5BIRR / Aliob — Connectivity verification (Phase 3 safety net)
name: Connectivity CI

# Phase 3 of the money-flow / connections command: run the integration
# verification suite on every push/PR so a broken connection is caught in
# CI, not discovered later on the live admin dashboard.
#
# ALSO runs automatically after every successful Deploy Supabase. That
# ordering matters: the suite's assertion RPCs are created by migrations
# (20260922000007), and migrations only reach the live DB via Deploy
# Supabase — so a push can transiently fail until the next deploy. This
# workflow_run trigger re-verifies the moment the DB catches up.
on:
  # === push / pull_request: TEMPORARILY OFF (Actions minutes) ===
  #
  # This suite sets up a Flutter SDK, resolves pub packages and runs the live
  # integration file on every push — a second, metered verification run on top
  # of Flutter CI's own test step, and the reason a single commit could spend
  # two runner slots. Actions minutes were above 90% when this was switched
  # off, and the request for that run was "one build, nothing else".
  #
  # It is not unguarded while off: the `workflow_run` trigger below still runs
  # it the moment a Deploy Supabase finishes, which is what the suite's
  # assertion RPCs depend on, and it can be run by hand any time
  # (Actions -> Connectivity CI -> Run workflow).
  #
  # RESTORE by uncommenting these two lines once the minutes meter is healthy:
  #
  # push:
  #   branches: [main, 'feat/**', 'fix/**']
  # pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Supabase"]
    types: [completed]

permissions:
  contents: read

jobs:
  connectivity:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # workflow_run always checks out the default branch — which is the
      # state the deploy actually produced, so the assertion set matches.
      - name: Checkout the deployed commit on workflow_run
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin ${{ github.event.workflow_run.head_sha }}
          git checkout ${{ github.event.workflow_run.head_sha }}

      - name: Setup Flutter
        # cache/pub-cache are OFF by default in flutter-action v2: without them
        # every run re-downloads the Flutter SDK and every pub package. See the
        # same note in flutter-ci.yml — Actions minutes are metered.
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install dependencies
        run: flutter pub get

      # Fork PRs cannot read repo secrets (expected and unavoidable) — mark
      # the run explicitly instead of silently passing. Same-repo pushes and
      # PRs always have the secrets and must not skip.
      - name: Decide whether secrets are available
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run connectivity suite (live, read-only)
        if: steps.gate.outputs.skip == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set (repo Settings -> Secrets and variables -> Actions). The connectivity safety net cannot run."
            exit 1
          fi
          mkdir -p build
          flutter test tools/integration_test/connectivity_test.dart \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            | tee build/connectivity-report.txt

      - name: Fork PR — connectivity check skipped
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "::notice::Fork PR: live connectivity suite skipped (no secret access from forks). It will run on the maintainers' merge push."
