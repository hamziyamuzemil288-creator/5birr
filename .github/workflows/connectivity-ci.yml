# 5BIRR / Aliob — Connectivity verification (Phase 3 safety net)
name: Connectivity CI

# Phase 3 of the money-flow / connections command: run the integration
# verification suite on every push/PR so a broken connection is caught in
# CI, not discovered later on the live admin dashboard.
#
# ALSO runs automatically after every successful Deploy Supabase. That
# ordering matters: the suite's assertion RPCs are created by migrations
# (20260922000007), and migrations only reach the live DB via Deploy
# Supabase — so a push can transiently fail until the next deploy. This
# workflow_run trigger re-verifies the moment the DB catches up.
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_run:
    workflows: ["Deploy Supabase"]
    types: [completed]

permissions:
  contents: read

jobs:
  connectivity:
    if: >-
      ${{ github.event_name != 'workflow_run' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # workflow_run always checks out the default branch — which is the
      # state the deploy actually produced, so the assertion set matches.
      - name: Checkout the deployed commit on workflow_run
        if: github.event_name == 'workflow_run'
        run: |
          git fetch origin ${{ github.event.workflow_run.head_sha }}
          git checkout ${{ github.event.workflow_run.head_sha }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # Fork PRs cannot read repo secrets (expected and unavoidable) — mark
      # the run explicitly instead of silently passing. Same-repo pushes and
      # PRs always have the secrets and must not skip.
      - name: Decide whether secrets are available
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # TEMPORARY DIAGNOSTIC: fingerprint the secrets (lengths, prefixes,
      # hash prefixes — never full values) and probe the API from the runner
      # so a bad/rotated key is distinguishable from a bad URL. Remove once
      # the 404 diagnosis is confirmed.
      - name: Secret fingerprint + runner-side API probe (diagnostic)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          fp() { printf 'len=%s sha256=%s first6=%s last4=%s\n' "${#1}" "$(printf '%s' "$1" | sha256sum | cut -c1-12)" "${1:0:6}" "${1: -4}"; }
          echo "SUPABASE_URL:"; fp "$SUPABASE_URL"; echo "  value-shape: $SUPABASE_URL"
          echo "SUPABASE_ANON_KEY:"; fp "$SUPABASE_ANON_KEY"
          case "$SUPABASE_ANON_KEY" in
            eyJ*) echo "  format: legacy JWT";;
            sb_publishable_*) echo "  format: publishable";;
            sb_secret_*) echo "  format: SECRET KEY IN ANON SLOT (wrong)";;
            *) echo "  format: UNRECOGNIZED";;
          esac
          echo "--- runner-side probes (with secret as-is) ---"
          curl -s -o /tmp/b1 -w 'rest rpc [%{http_code}] ' -X POST "$SUPABASE_URL/rest/v1/rpc/assert_profiles_have_city" -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{}'; head -c 200 /tmp/b1; echo
          curl -s -o /tmp/b2 -w 'auth token [%{http_code}] ' -X POST "$SUPABASE_URL/auth/v1/token?grant_type=password" -H "apikey: $SUPABASE_ANON_KEY" -H 'Content-Type: application/json' -d '{"email":"probe@invalid.invalid","password":"x"}'; head -c 120 /tmp/b2; echo

      - name: Run connectivity suite (live, read-only)
        if: steps.gate.outputs.skip == 'false'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set (repo Settings -> Secrets and variables -> Actions). The connectivity safety net cannot run."
            exit 1
          fi
          mkdir -p build
          flutter test tools/integration_test/connectivity_test.dart \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            | tee build/connectivity-report.txt

      - name: Fork PR — connectivity check skipped
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "::notice::Fork PR: live connectivity suite skipped (no secret access from forks). It will run on the maintainers' merge push."
