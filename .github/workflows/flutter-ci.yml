# 5BIRR Flutter CI Pipeline — debug + release builds
name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  flutter-pub-get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Scaffold missing platform directories
        run: flutter create --platforms=android,ios .

      - name: Commit platform scaffolding if generated
        # Only on main pushes: PR checkouts sit on a merge ref that cannot
        # accept a push.
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain android/ ios/)" ]; then
            echo "No new platform files — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/ ios/
            git commit -m "chore: scaffold missing android/ios platform directories via flutter create"
            # Rebase onto whatever landed while this job was running. Without
            # this a push that lands during the build makes every later
            # scaffold commit fail with "rejected: fetch first", and the
            # non-fast-forward took the whole build down with it — including
            # the analyze/test/apk steps that had not run yet.
            #
            # Scaffolding is disposable: it is regenerated by the step above
            # on every run, so failing to persist it is not worth failing a
            # release build over. Warn and carry on rather than erroring.
            if ! git pull --rebase origin main; then
              echo "::warning::could not rebase generated platform scaffolding; skipping commit"
              exit 0
            fi
            git push || echo "::warning::could not push generated platform scaffolding; it will be regenerated next run"
          fi

      - name: Inject Supabase env vars
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (non-blocking)
        run: flutter analyze
        continue-on-error: true

      # Phase 3 safety net: run the app test suite on every push/PR so a
      # broken connection is caught in CI, not on the live dashboard. The
      # connectivity checks live in connectivity-ci.yml (they need live
      # Supabase secrets); this step runs the local unit/widget tests.
      - name: Run tests
        run: flutter test

      - name: Commit pubspec.lock if changed
        if: github.event_name == 'push'
        run: |
          if [ -z "$(git status --porcelain pubspec.lock)" ]; then
            echo "pubspec.lock unchanged — skipping commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock
            git commit -m "ci: auto-generate pubspec.lock"
            git push
          fi

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload debug APK artifact
        # Best-effort only: Actions artifact storage has a small quota whose
        # meter lags cleanup by 6-12 h, and a quota block here must not fail
        # the whole pipeline — the dedicated Build Debug APK / Build Release
        # AAB workflows deliver the artifacts (with Release fallback).
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          # 14-day retention: full builds here duplicate the dedicated
          # Build Release AAB / Build Debug APK workflows and filled Actions
          # storage at the 90-day default. See docs/SIGNING.md history.
          retention-days: 14

      # === Release Bundle Build ===
      # Keystore is stored base64-encoded in the KEYSTORE_BASE64 Actions secret
      # and decoded at build time (never committed to the repo). See docs/SIGNING.md.
      # PKCS12: the key password equals the store password.
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::One or more signing secrets are missing/empty. Required: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD, KEY_ALIAS (see docs/SIGNING.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-keystore.p12"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release-keystore.p12" >> "$GITHUB_ENV"

      - name: Build release app bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload release AAB artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

