name: birr5
description: Aliob — location-based multi-sector marketplace and service platform.
publish_to: 'none'
version: 1.1.0+70

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  http: ^1.2.0
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.6
  # Direct, not transitive: the staff workspace subscribes to postgres_changes
  # so the task feed updates the moment work arrives, and naming the
  # RealtimeChannel type requires importing it. Already resolved at 2.13.0
  # through supabase_flutter, so this pins nothing new.
  realtime_client: ^2.13.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0
  geocoding: ^4.0.0
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  intl: ^0.19.0
  image_picker: ^1.0.7
  share_plus: ^13.2.0
  path_provider: ^2.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/aliob_logo_mark.png
